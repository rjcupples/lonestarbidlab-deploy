<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Lone Star Bid Lab</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0f172a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #b91c1c;
      --border: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      transition: border-color 0.2s, background 0.2s;
    }

    a:hover {
      border-color: var(--accent);
      background: rgba(185, 28, 28, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Looks like this page got buried underground. Let's head back to solid ground.</p>
    <a href="/">← Back Home</a>
  </div>
</body>
</html>
